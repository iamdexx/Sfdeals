name: nightly
on:
  schedule:
    - cron: "0 11 * * *"   # 5am Central
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sfdeals/**, config.json, .github/workflows/nightly.yml]
permissions:
  contents: write
concurrency: nightly
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m sfdeals.run all
      - name: commit data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data
          git diff --cached --quiet || git commit -m "data: nightly pull $(date -u +%F)"
          git push
