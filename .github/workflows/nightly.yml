name: heartbeat
on:
  schedule:
    # every 2 hours, 6am to 10pm Central (UTC-6; an hour earlier in summer)
    - cron: "0 12,14,16,18,20,22 * * *"
    - cron: "0 0,2,4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sfdeals/**, config.json, requirements.txt, .github/workflows/nightly.yml]
permissions:
  contents: write
concurrency: heartbeat
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m sfdeals.run all
        env:
          TRACERFY_API_KEY: ${{ secrets.TRACERFY_API_KEY }}
      - name: commit data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data
          git diff --cached --quiet || git commit -m "data: pull $(date -u +%FT%H:%MZ)"
          git push
