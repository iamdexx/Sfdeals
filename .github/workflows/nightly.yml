name: heartbeat
on:
  schedule:
    # every 2 hours, 6am to 10pm Central (UTC-6; an hour earlier in summer)
    - cron: "0 12,14,16,18,20,22 * * *"
    - cron: "0 0,2,4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sfdeals/**, config.json, requirements.txt, .github/workflows/nightly.yml]
permissions:
  contents: write
concurrency: heartbeat
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      markets: ${{ steps.m.outputs.markets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - id: m
        run: echo "markets=$(python -c 'import json; from sfdeals.markets import MARKETS; print(json.dumps(list(MARKETS)))')" >> "$GITHUB_OUTPUT"
  pull:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        market: ${{ fromJson(needs.plan.outputs.markets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m sfdeals.run ${{ matrix.market }} all
        timeout-minutes: 40
        env:
          TRACERFY_API_KEY: ${{ secrets.TRACERFY_API_KEY }}
      - name: commit data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/${{ matrix.market }}
          git diff --cached --quiet && exit 0
          git commit -m "data: ${{ matrix.market }} pull $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
  site:
    needs: pull
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m sfdeals.site https://deals-site.pages.dev
      - name: deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fa38e4e6ce251caba23555f398017263
        run: cd site && npx -y wrangler@3 pages deploy . --project-name=deals-site --branch=main --commit-dirty=true
